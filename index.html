<script>
const T=[["4","5","5","6","6","6/4","6/5","6/6","6/6","6/6"],
["4","4","5","5","6","6","6/4","6/5","6/6","6/6"],
["3","4","4","5","5","6","6","6/4","6/5","6/6"],
["3","3","4","4","5","5","6","6","6/4","6/5"],
["3","3","3","4","4","5","5","6","6","6/4"],
["3","3","3","3","4","4","5","5","6","6"],
["3","3","3","3","3","4","4","5","5","6"],
["3","3","3","3","3","3","4","4","5","5"],
["3","3","3","3","3","3","3","4","4","5"],
["3","3","3","3","3","3","3","3","4","4"]];
const $=id=>document.getElementById(id), pct=x=>(100*x).toFixed(1)+"%";
function killP(s,d,bonus=0){s=Math.min(10,Math.max(1,s));d=Math.min(10,Math.max(1,d));
 const c=String(T[s-1][d-1]).trim(), s1=n=>Math.min(1,Math.max(0,(7-Math.max(2,n-bonus))/6));
 if(c.includes("/")){const [a,b]=c.split("/").map(Number);return s1(a)*s1(b);} return s1(Number(c));}
// Cleaving Blow: probability that a single kill die shows a natural 6 AND succeeds (such a die causes 2 wounds)
function cleaveP(s,d,bonus=0){s=Math.min(10,Math.max(1,s));d=Math.min(10,Math.max(1,d));
 const c=String(T[s-1][d-1]).trim(),s1=n=>Math.min(1,Math.max(0,(7-Math.max(2,n-bonus))/6));
 if(c.includes("/")){const b=Number(c.split("/")[1]);return s1(b)/6;} return 1/6;}
function dist(n){return [1,2,3,4,5,6].map(i=>Math.pow(i/6,n)-Math.pow((i-1)/6,n));} // P(highest die = i)
function duel(P,Q){ // P,Q = {n:Stage-1 dice, f:effective Fight, two, mf, rr:rerolls, elf}
 const a=dist(P.n),b=dist(Q.n);
 const ef=(pl,m)=>pl.two&&!pl.mf&&m<6?m-1:m; // 2-handed: -1 to each die except a 6 (no penalty with master forged/burly)
 const win=(x,y)=>x>y?1:x<y?-1:(P.f>Q.f?1:P.f<Q.f?-1:0); // 0 = full tie (same highest die and same Fight)
 const pT=0.5+((P.elf?1:0)-(Q.elf?1:0))/6; // deciding die: P wins on 1-3 (+1 face per elven blade, -1 for the opponent's)
 let wA=0,wB=0;
 // Rerolls (Banner, Lord of the West): the losing side re-rolls its lowest die (best choice; for 1 die, its only die), one reroll at a time while it still has rerolls left.
 const go=(x,y,rA,rB,p)=>{const w=win(x,y);if(!w){wA+=p*pT;wB+=p*(1-pT);return;}
  if(w===1){if(rB>0){for(let r=1;r<=6;r++){const nv=ef(Q,r);go(x,Q.n>=2?Math.max(y,nv):nv,rA,rB-1,p/6);}return;}wA+=p;}
  else{if(rA>0){for(let r=1;r<=6;r++){const nv=ef(P,r);go(P.n>=2?Math.max(x,nv):nv,y,rA-1,rB,p/6);}return;}wB+=p;}};
 for(let i=0;i<6;i++)for(let j=0;j<6;j++)go(ef(P,i+1),ef(Q,j+1),P.rr,Q.rr,a[i]*b[j]);
 const s=wA+wB;return [wA/s,wB/s];}
// distribution of the number of successful wound rolls from n dice (index = successes); lw = reroll one failed die
function succDist(p,n,lw,p2){
 if(p2){ // Cleaving Blow: each die causes 0, 1 or 2 wounds (2 when it is a natural 6 that succeeds)
  const q=[1-p,p-p2,p2];let dp=[[1]]; // dp[w][f]: w wounds so far, f failed dice
  for(let t=0;t<n;t++){const nd=[];const put=(w,f,v)=>{(nd[w]=nd[w]||[])[f]=((nd[w]||[])[f]||0)+v;};
   dp.forEach((row,w)=>row&&row.forEach((v,f)=>{if(!v)return;put(w,f+1,v*q[0]);put(w+1,f,v*q[1]);put(w+2,f,v*q[2]);}));dp=nd;}
  const e=new Array(2*n+1).fill(0);
  dp.forEach((row,w)=>row&&row.forEach((v,f)=>{if(!v)return;if(lw&&f>=1){for(let x=0;x<3;x++)e[w+x]+=v*q[x];}else e[w]+=v;}));
  return e;}
 const d=[];let C=1;for(let k=0;k<=n;k++){if(k>0)C=C*(n-k+1)/k;d.push(C*Math.pow(p,k)*Math.pow(1-p,n-k));}
 if(!lw||n===0)return d;const e=new Array(n+1).fill(0);
 for(let k=0;k<=n;k++){if(k<n){e[k]+=d[k]*(1-p);e[k+1]+=d[k]*p;}else e[k]+=d[k];}return e;}
// Crown of Kings: each wound against the model is ignored on a 1-in-6 chance (a roll of 6), so each wound survives with probability 5/6
function thin(d,keep){const e=new Array(d.length).fill(0);d.forEach((p,k)=>{let C=1;for(let j=0;j<=k;j++){if(j>0)C=C*(k-j+1)/j;e[j]+=p*C*Math.pow(keep,j)*Math.pow(1-keep,k-j);}});return e;}
function run(){const v=id=>+$(id).value||1,c=id=>$(id).checked;
 const side=X=>({n0:v("a"+X),f0:v("f"+X),s:v("s"+X),d:v("d"+X),w:v("wd"+X),cr:v("cr"+X),two:c("t"+X),mf:c("mf"+X),ban:c("b"+X),elf:c("e"+X),
  lw:c("lw"+X),cb:c("cb"+X),ck:c("ck"+X),md:c("md"+X),sg:c("sg"+X),mc:c("mc"+X),bd:c("bd"+X),ds:c("ds"+X),dw:c("dw"+X),sh:c("sh"+X),sw:c("sw"+X),
  x2:c("tr"+X)||c("pr"+X),oppProne:c("pr"+X)}); // x2: trapped/prone opponent doubles kill dice
 const A=side("A"),B=side("B");
 // Master Duellist: Fight rises to the enemy's Fight if lower
 const fA=A.md?Math.max(A.f0,B.f0):A.f0,fB=B.md?Math.max(B.f0,A.f0):B.f0;
 // Stage 1 dice: Attacks (doubled by Shielding) + 1 if mounted and charged. Rerolls: Banner + Lord of the West
 const st1=(S,f)=>({n:S.n0*(S.sg?2:1)+(S.mc?1:0),f,two:S.two,mf:S.mf,elf:S.elf,rr:(S.ban?1:0)+(S.lw?1:0)});
 const [pA,pB]=duel(st1(A,fA),st1(B,fB));
 // Stage 2: distribution of successful wound rolls by the winner (S) against the other model (Z)
 const stage2=(S,Z)=>{
  const need=S.ds?(Z.dw?2:1):Z.w; // Drain soul: 1 success (2 against Demon of the ancient world)
  if(S.sg)return {need,dist:[1]}; // Shielding: no kill roll
  // dice: (Attacks + 1 if mounted and charged), doubled if mounted-and-charged, trapped or prone opponent (the doublings do not stack)
  const dice=(S.n0+(S.mc?1:0))*((S.x2||S.mc)?2:1);
  // Blades of the dead: Defence = 10 - Courage (Shield added does not apply then); otherwise Defence (+1 with Shield added)
  const def=S.bd?10-Z.cr:Z.d+(Z.sh?1:0)+(Z.sw?1:0);
  const raw=succDist(killP(S.s,def,S.two?1:0),dice,S.lw,S.cb?cleaveP(S.s,def,S.two?1:0):0);
  return {need,dist:Z.ck?thin(raw,5/6):raw};};
 // "Opponent trapped/prone" only affects the player it is set for (doubles their kill dice if they win); a prone model that wins strikes as normal
 const sA=stage2(A,B),sB=stage2(B,A);
 const kill=r=>r.dist.reduce((t,x,k)=>k>=r.need?t+x:t,0);
 const kA=kill(sA),kB=kill(sB);
 const mix=(col,pc)=>`color-mix(in srgb,var(${col}) ${pc}%,var(--bg))`;
 const rows=[],segs=[];
 const addSide=(nm,oth,pw,r,col,rev)=>{ // returns main rows + wound-count sub rows
  const k=kill(r),part=[];
  for(let j=0;j<r.need;j++)part.push(r.dist[j]||0); // successes 0..need-1 (target survives)
  const killRow=[nm+" wins & kills "+oth,pw*k,col==="A"?"var(--ac)":"var(--bc)",0];
  const surv=[nm+" wins, "+oth+" survives",pw*(1-k),mix(col==="A"?"--ac":"--bc",45)];
  const subs=r.need>=2?part.map((x,j)=>[(j===0?"no wounds":j+(j===1?" wound":" wounds"))+" caused",pw*x,mix(col==="A"?"--ac":"--bc",20+40*j/r.need)]):[];
  return {killRow,surv,subs,part};};
 const a1=addSide("A","B",pA,sA,"A"),b1=addSide("B","A",pB,sB,"B");
 const bar=[a1.killRow].concat(a1.subs.length?a1.subs.slice().reverse():[a1.surv],b1.subs.length?b1.subs:[b1.surv],[b1.killRow]);
 const row=(x,cls)=>`<div class="res ${cls||""}"><span><span class="sw" style="background:${x[2]}"></span>${x[0]}</span><b>${pct(x[1])}</b></div>`;
 $("out").innerHTML=`<div class="bar">${bar.map(x=>`<div style="width:${x[1]*100}%;background:${x[2]}"></div>`).join("")}</div>`+
  row(a1.killRow)+row(a1.surv)+a1.subs.map(x=>row(x,"sub")).join("")+row(b1.surv)+b1.subs.map(x=>row(x,"sub")).join("")+row(b1.killRow)+
  `<p class="mu">Duel: A wins ${pct(pA)}, B wins ${pct(pB)}. Kill chance if winning: A ${pct(kA)}, B ${pct(kB)}.</p>`;}
let h="<tr><th></th>"+[...Array(10)].map((_,i)=>"<th>D"+(i+1)+"</th>").join("")+"</tr>";
T.forEach((r,i)=>{h+="<tr><th>S"+(i+1)+"</th>"+r.map((c,j)=>`<td><input data-r="${i}" data-c="${j}" value="${c}"></td>`).join("")+"</tr>";});
$("tbl").innerHTML=h;
document.addEventListener("change",e=>run());
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.r!==undefined)T[t.dataset.r][t.dataset.c]=t.value;run();});
